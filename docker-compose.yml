services:
  app:
    build:
      context: .
      target: production-main
    ports:
      - "3001:3000"
    env_file:
      - .env
    depends_on:
      - websocket
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G

  websocket:
    build:
      context: .
      target: production-websocket
    ports:
      - "6969:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s