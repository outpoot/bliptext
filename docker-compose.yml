services:
  app:
    build:
      context: .
      target: production-main
    ports:
      - "3001:3000"
    env_file:
      - .env
    depends_on:
      - websocket
    networks:
      - default
      - shared_backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G

  websocket:
    build:
      context: .
      target: production-websocket
    ports:
      - "6969:8080"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
      - shared_backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  shared_backend:
    external: true
